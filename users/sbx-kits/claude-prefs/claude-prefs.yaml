# syntax=docker/sandbox-kit:3
#
# Mixin Docker Sandboxes (sbx) personnel : préférences Claude Code du settings.local.json de l'hôte
# (style de sortie, skills désactivés, serveurs .mcp.json activés), absentes de la VM puisque sbx
# n'importe pas ~/.claude. Posées dans le settings.json utilisateur de la VM plutôt que dans le
# .claude/settings.local.json du clone, qu'aucun ignore global ne masque dans la VM.
# Le reste du settings.local.json de l'hôte reste dehors : deny git push (bloquerait /vpp-implement),
# hook herdr-open-worktree.sh (absent de la VM), permissions mcp__idea (pas d'IntelliJ).
#
# Usage : sbx run claude --kit ~/workspace/perso/ansible-dev-workstation/users/sbx-kits/claude-prefs .
schemaVersion: "3"
kind: mixin
displayName: Claude prefs
description: Style de sortie, skills désactivés et serveurs MCP du projet repris de l'hôte
requires: ["claude"]
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # settings.json est réécrit à la création de la sandbox : les préférences sont reposées à chaque démarrage.
        - description: Poser les préférences Claude Code dans settings.json
          user: agent
          command: |
            set -eu
            settings=/home/agent/.claude/settings.json
            mkdir -p "$(dirname "$settings")"
            [ -f "$settings" ] || echo '{}' > "$settings"
            tmp=$(mktemp)
            /usr/bin/jq '
              .outputStyle = "Concise"
              | .enabledMcpjsonServers = ["atlassian", "notion"]
              | .skillOverrides = {"vpp-doc": "off", "vpp-kotlin-teach": "off", "vpp-kotlin-review": "off"}
            ' "$settings" > "$tmp"
            mv -f "$tmp" "$settings"
